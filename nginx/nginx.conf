# Configuración de producción para servir SICIL (frontend) y redirigir /api al backend.
# Controles: RS-CIF-01 (HTTPS), RS-WEB-01 (encabezados), RS-WEB-03 (límite de peticiones),
# RS-WEB-05 (métodos), RS-WEB-06 (ocultar versión del servidor).

server_tokens off;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sicil.crt;
    ssl_certificate_key /etc/nginx/certs/sicil.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;   # adjuntos de máx. 5 MB (RS-VAL-05)
    autoindex off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) { return 405; }

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:3000;
        include /etc/nginx/proxy_params_sicil;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:3000;
        include /etc/nginx/proxy_params_sicil;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA: toda ruta desconocida regresa index.html, sin caché
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }
}
